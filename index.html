<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DRAFT XI — 드래프트 축구 매니저</title>
<meta name="description" content="선수 풀을 정하고 드래프트로 팀을 꾸려 리그·토너먼트를 치르는 축구 감독 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}

/* 레이아웃: 야간 경기장 중계 콘솔. 왼쪽 정렬 단일 화면 앱, 패널은 경기장 라인처럼 얇은 선으로 구분 */
:root {
  --bg: #0b110e; --panel: #111a16; --panel2: #16211c; --line: #26342d; --line2: #33463c;
  --fg: #e6eee8; --muted: #8ea39a; --dim: #5f7369;
  --accent: #f2b33d; --accent-ink: #1b1405; --chalk: #dfe8e2;
  --good: #5cc98a; --bad: #e46a5a; --warn: #f2b33d;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; }
* { box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
.brand b { color: var(--accent); }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.nav button, .btn { background: transparent; border: 1px solid var(--line2); border-radius: 6px; padding: 7px 12px; color: var(--fg); }
.nav button[aria-current="true"] { background: var(--panel2); border-color: var(--accent); color: var(--accent); }
.btn:hover, .nav button:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; color: var(--muted); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn.danger { border-color: #6a2e27; color: #f0a196; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.screen { flex: 1; min-height: 0; overflow: auto; }
.wrap { padding: 20px 16px 40px; max-width: 1200px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .02em; margin: 0; text-wrap: balance; }
h2 { font-size: 26px; } h3 { font-size: 18px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.lbl { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.muted { color: var(--muted); } .dim { color: var(--dim); }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }
select, input[type=text], input[type=number], textarea { background: var(--panel2); border: 1px solid var(--line2); border-radius: 6px; padding: 7px 9px; min-width: 0; }
textarea { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 7px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 10px; color: var(--muted); border-right: 1px solid var(--line2); font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.kit { width: 22px; height: 22px; border-radius: 50%; border: 3px solid; display: inline-block; flex: none; }
/* 매치 셋업 */
.vs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch; }
.vs .mid { font-family: var(--display); font-size: 34px; color: var(--dim); align-self: center; }
.teamcard .name { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1; }
.meter { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); }
@media (max-width: 720px) { .vs { grid-template-columns: 1fr; } .vs .mid { text-align: center; } }
/* 전술 */
.tac { display: grid; grid-template-columns: minmax(280px, 1.1fr) minmax(260px, 1fr); gap: 16px; }
@media (max-width: 900px) { .tac { grid-template-columns: 1fr; } }
.tpitch { position: relative; aspect-ratio: 68 / 80; max-width: 100%; background: repeating-linear-gradient(0deg, #2a6136 0 10%, #2f6b3c 10% 20%); border: 2px solid rgba(240,245,240,.7); border-radius: 6px; overflow: hidden; }
.tpitch::before { content: ""; position: absolute; left: 22%; right: 22%; bottom: 0; height: 17%; border: 2px solid rgba(240,245,240,.6); border-bottom: 0; }
.tpitch::after { content: ""; position: absolute; left: 0; right: 0; top: 0; border-top: 2px solid rgba(240,245,240,.6); }
.slot { position: absolute; transform: translate(-50%, -50%); width: 86px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 0; color: var(--fg); }
.slot .disc { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 16px; border: 3px solid; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.slot .nm { font-size: 11px; background: rgba(8,14,11,.78); padding: 1px 5px; border-radius: 4px; max-width: 86px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .meta { font-size: 10px; color: var(--chalk); background: rgba(8,14,11,.6); padding: 0 4px; border-radius: 3px; }
.slot[aria-pressed="true"] .disc { outline: 3px solid var(--accent); outline-offset: 2px; }
.slot .en { width: 34px; height: 3px; background: rgba(0,0,0,.4); border-radius: 2px; overflow: hidden; } .slot .en i { display: block; height: 100%; background: var(--good); }
.fam-bad .meta { color: #ffb4a8; } .fam-mid .meta { color: #ffd98a; }
.plist { max-height: 520px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.plist table { width: 100%; border-collapse: collapse; }
.plist th, .plist td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.plist th { position: sticky; top: 0; background: var(--panel2); color: var(--muted); font-weight: 500; font-size: 12px; z-index: 1; }
.plist tr.pick { cursor: pointer; } .plist tr.pick:hover td { background: var(--panel2); }
.plist tr.sel td { background: #2a2414; }
.plist .grp td { color: var(--accent); font-family: var(--display); letter-spacing: .08em; font-size: 13px; background: var(--panel); }
.tag { display: inline-block; font-family: var(--display); font-size: 12px; padding: 1px 6px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--line2); color: var(--chalk); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }
.instr { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 16px; }
.instr .f { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.ti-group + .ti-group { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
/* 경기 화면 */
.match { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 330px; grid-template-rows: auto minmax(0, 1fr) auto; }
@media (max-width: 900px) { .match { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(260px, 56vh) auto auto; } }
.score { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 0; padding: 8px 16px; background: #070b09; border-bottom: 1px solid var(--line); }
.sb { display: flex; align-items: stretch; font-family: var(--display); font-weight: 700; border-radius: 6px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
.sb > div { display: flex; align-items: center; padding: 4px 12px; font-size: 22px; letter-spacing: .04em; }
.sb .t { min-width: 64px; justify-content: center; }
.sb .s { background: #f4f6f2; color: #111; min-width: 74px; justify-content: center; font-size: 26px; font-variant-numeric: tabular-nums; }
.sb .clk { background: #1c2621; color: var(--accent); min-width: 72px; justify-content: center; font-variant-numeric: tabular-nums; }
.scorers { display: flex; gap: 18px; margin-left: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.view { position: relative; background: #000; min-height: 0; overflow: hidden; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.labels span { position: absolute; transform: translate(-50%, -100%); font-size: 11px; background: rgba(8,14,11,.78); color: var(--fg); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.banner { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); font-family: var(--display); font-weight: 700; font-size: clamp(34px, 7vw, 76px); letter-spacing: .08em; color: #fff; text-shadow: 0 4px 18px rgba(0,0,0,.7); pointer-events: none; text-align: center; }
.banner small { display: block; font-size: .32em; letter-spacing: .04em; color: var(--accent); }
.rtag { position: absolute; top: 12px; left: 12px; background: var(--bad); color: #fff; font-family: var(--display); font-weight: 700; letter-spacing: .1em; padding: 3px 10px; border-radius: 4px; }
.ctrl { grid-column: 1; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); flex-wrap: wrap; }
.ctrl .sep { width: 1px; align-self: stretch; background: var(--line); }
.side { grid-row: 2 / 4; grid-column: 2; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
@media (max-width: 900px) { .side { grid-row: auto; grid-column: 1; border-left: 0; border-top: 1px solid var(--line); min-height: 320px; } }
.side .tabs { margin: 0; padding: 0 8px; }
.sidebody { flex: 1; overflow: auto; padding: 10px 12px; min-height: 0; }
.feed { display: flex; flex-direction: column; gap: 6px; }
.feed .e { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: start; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.feed .e .m { font-family: var(--display); color: var(--muted); font-size: 15px; }
.feed .e.goal { color: #fff; font-weight: 600; } .feed .e.goal .m { color: var(--accent); }
.feed .pip { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
.stat { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 9px; }
.stat .c { text-align: center; color: var(--muted); font-size: 12px; }
.stat .v { font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; }
.stat .v:last-child { text-align: right; }
.bar2 { display: flex; height: 4px; gap: 2px; margin-top: 3px; }
.bar2 i { display: block; height: 100%; border-radius: 2px; }
.prow { display: grid; grid-template-columns: 26px 1fr 38px 52px 36px; gap: 6px; align-items: center; font-size: 12.5px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.prow .r { font-family: var(--display); font-size: 15px; text-align: right; }
.en2 { height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; } .en2 i { display: block; height: 100%; }
.rbar { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; }
.rbar input[type=range] { flex: 1; accent-color: var(--accent); }
/* 모달 */
.modal { position: fixed; inset: 0; background: rgba(3,6,5,.72); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal .box { background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; width: min(1180px, 100%); max-height: calc(100% - 20px); overflow: auto; padding: 18px 16px; }
.modal .box.small { width: min(520px, 100%); }
.mhead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.mhead .grow { flex: 1; }
/* DB */
.db { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .db { grid-template-columns: 1fr; } }
.tlist { display: flex; flex-direction: column; gap: 2px; max-height: 70vh; overflow: auto; }
.tlist button { display: flex; align-items: center; gap: 8px; text-align: left; background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 8px; }
.tlist button[aria-current="true"] { border-color: var(--accent); background: var(--panel2); }
.sgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px 22px; }
.sg h4 { font-family: var(--display); font-weight: 600; letter-spacing: .06em; margin: 0 0 6px; color: var(--accent); font-size: 15px; }
.srow { display: grid; grid-template-columns: 1fr 110px 44px; gap: 8px; align-items: center; font-size: 13px; padding: 2px 0; }
.srow input[type=range] { accent-color: var(--accent); width: 100%; }
.srow input[type=number] { padding: 3px 5px; width: 100%; }
.c90 { color: #7fe0a6 } .c80 { color: #c6e07f } .c70 { color: #f2d36b } .c60 { color: #f2a65a } .c0 { color: #e8836f }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--accent); padding: 8px 16px; border-radius: 8px; z-index: 80; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.55; }


/* 선수 프로필 */
.linkbtn { background: none; border: 0; padding: 0; color: var(--fg); text-align: left; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; cursor: pointer; }
.linkbtn:hover { text-decoration-color: var(--accent); }
.pill { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; border: 1px solid; }
.pill.good { color: #8fdcae; border-color: #2f6b47; } .pill.warn { color: #f2cf7a; border-color: #6b5a2a; } .pill.bad { color: #f0a196; border-color: #6a2e27; }
.pprof { display: flex; flex-direction: column; gap: 16px; }
.phead { display: flex; align-items: center; gap: 14px; }
.pnum { width: 52px; height: 52px; flex: none; border-radius: 10px; border: 3px solid; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 26px; }
.povr { margin-left: auto; font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1; }
.pgrid { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 720px) { .pgrid { grid-template-columns: 1fr; } }
.radar { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; overflow: visible; }
.radar .rg { fill: none; stroke: var(--line2); stroke-width: 1; }
.radar .ravg { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
.radar .rval { fill: color-mix(in srgb, var(--accent) 28%, transparent); stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.radar .rdot { fill: var(--accent); stroke: var(--panel); stroke-width: 2; }
.radar .rlbl { fill: var(--fg); font-size: 12px; font-family: var(--body); }
.sw { display: inline-block; width: 14px; height: 3px; vertical-align: middle; border-radius: 2px; }
.sw.val { background: var(--accent); } .sw.avg { border-top: 2px dashed var(--muted); height: 0; }
.biogrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
.biogrid .num { font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--accent); color: var(--fg); }
.chip.ghost { border-color: var(--line2); color: var(--muted); }
.gb { font-size: 13.5px; padding: 4px 0 4px 10px; border-left: 3px solid; margin-top: 4px; }
.gb.good { border-color: var(--good); } .gb.bad { border-color: var(--bad); }
.srow2 { display: grid; grid-template-columns: 1fr 90px 30px; gap: 8px; align-items: center; font-size: 13px; padding: 2px 0; }
.bar1 { height: 5px; background: var(--panel2); border-radius: 3px; overflow: hidden; } .bar1 i { display: block; height: 100%; background: var(--muted); }

/* 경기 분석 */
.anl h3 { font-size: 14px; }
.diag { border: 1px solid var(--line); border-left: 3px solid var(--line2); border-radius: 6px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
.diag.warn { border-left-color: var(--warn); } .diag.good { border-left-color: var(--good); } .diag.info { border-left-color: #6f8fb0; }
.diag .dlv { font-size: 11px; color: var(--muted); }
.diag .tip { color: var(--chalk); }
.pmap { width: 100%; height: auto; display: block; border-radius: 6px; }
.pmap .pf { fill: #23472f; } .pmap .pl { fill: none; stroke: rgba(235,242,236,.45); stroke-width: .3; }
.pmap .pok { stroke: #e9efe9; stroke-width: .35; opacity: .75; } .pmap .pfail { stroke: #f0a196; stroke-width: .3; stroke-dasharray: 1 .8; opacity: .8; }
.pmap .pokd { fill: #e9efe9; } .pmap .pfaild { fill: #f0a196; }
.pmap .plink { stroke: #f2d38a; stroke-linecap: round; }
.pmap .pnode circle { stroke: #0b110e; stroke-width: .4; } .pmap .pnode.dim { opacity: .3; }
.pmap .pnum2 { font-size: 2.4px; font-family: var(--display); font-weight: 700; }
.pmap .sshot { fill: none; stroke: #f2b33d; stroke-width: .45; } .pmap .sgoal { fill: #f2b33d; stroke: #0b110e; stroke-width: .3; }
.psum { border: 1px solid var(--line); border-radius: 6px; }
.psum summary { display: grid; grid-template-columns: 26px minmax(0, 1fr) 36px; gap: 6px; align-items: center; padding: 6px 8px; cursor: pointer; font-size: 13px; list-style: none; }
.psum summary::-webkit-details-marker { display: none; }
.psum .psn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.psum .r { font-family: var(--display); font-size: 15px; text-align: right; }
.psb { padding: 0 10px 10px; }
.anl.big .pmap { max-width: 760px; }
.totw { max-width: 420px; aspect-ratio: 68 / 72; }
.rk.gotm { grid-template-columns: 24px minmax(0, 1fr) auto; align-items: center; }
/* 교체 바 */
.bslide { position: relative; height: 28px; }
.bslide .btrack { position: absolute; left: 0; right: 0; top: 10px; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--good) 55%, var(--panel2)); overflow: hidden; }
.bslide .bfill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.bslide .bmin { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--bad); }
.bslide input[type=range] { position: absolute; inset: 0; width: 100%; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; }
.bslide input[type=range]::-webkit-slider-runnable-track { background: transparent; height: 28px; }
.bslide input[type=range]::-moz-range-track { background: transparent; }
.bslide input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: 3px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
.bslide input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
.bsum { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13.5px; }
.recrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; background: var(--panel2); border-radius: 8px; }
.recrow .grow { flex: 1 1 220px; min-width: 0; }
.depthtbl td { vertical-align: top; }
.depth { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.dp { font-size: 13px; white-space: nowrap; }
.dp.st { font-weight: 700; }
.dp.inj { opacity: .55; text-decoration: line-through; }
.lvbar { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.lvbar .trk { position: relative; flex: 1 1 auto; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }

/* ===================== DRAFT XI — Road to Legend 화면 구성으로 재단장 ===================== */
:root { --panel3: #232833; --gold: var(--accent); --blue: #2f8cf0; --good: #2fbf71; --bad: #e5484d; --warn: #f08c2e; --muted: #8b94a3; --dim: #5d6573; --fg: #eef1f5; --chalk: #dfe4ec; --pitch: #0f3d2b; --pitch2: #124733; --r: 14px; }

.wrap { max-width: 1280px; animation: dxFadeUp .4s cubic-bezier(.2,.7,.2,1) both; }

.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
